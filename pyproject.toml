[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "json-flex"
description = "A JSON serializer with depth-limited indentation and compact leaf sequences."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "demoliisher" }]
keywords = ["json", "formatter", "pretty-print"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []
# Keep in sync with __version__ in src/json_flex/__init__.py.
version = "1.0.0"

[project.optional-dependencies]
test = ["pytest>=7"]

[dependency-groups]
dev = ["pytest>=7", "ruff>=0.17"]

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "RUF", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["json_flex"]

[tool.ruff.format]
quote-style = "double"

[tool.hatch.build.targets.wheel]
packages = ["src/json_flex"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
